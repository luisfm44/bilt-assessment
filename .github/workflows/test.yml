name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test backend
        run: mvn --batch-mode test
        continue-on-error: ${{ github.repository == 'revelotech/bilt-assessment' }}

      - name: Test dashboard
        run: npm run test:web
        continue-on-error: ${{ github.repository == 'revelotech/bilt-assessment' }}
